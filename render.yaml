services:
  - type: web
    name: lccounter
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/sesion
    disk:
      name: espacio-trabajo
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: LCCOUNTER_ADMIN_USUARIO
        sync: false
      - key: LCCOUNTER_ADMIN_CLAVE
        sync: false
      - key: LCCOUNTER_ADMIN_NOMBRE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
